# Lowers media while an alert sound plays (an app's notification sound, a
# reminder chime, the adhan), from WirePlumber's media-role-nodes example.
# Playback goes through a Multimedia loopback sink and Notification streams
# (paplay's "event" maps onto it) through a Notifications one; while one of
# those plays, WirePlumber turns the Multimedia loopback down. Apps' own
# levels aren't touched, so nothing ducked is saved as an app's level.
# Quickshell's switch sets the duck level (1 = off) with wpctl settings --save.
# The level is linear: 0.216 is 60% on wpctl's (cubic) scale.

wireplumber.profiles = {
  main = {
    policy.linking.role-based.loopbacks = required
  }
}

wireplumber.settings = {
  # Streams without a role are media too, so they go through Multimedia.
  node.stream.default-media-role = "Multimedia"
  linking.role-based.duck-level = 0.216
}

wireplumber.components.rules = [
  {
    matches = [
      {
        provides = "~loopback.sink.*"
      }
    ]
    actions = {
      merge = {
        arguments = {
          capture.props = {
            policy.role-based.target = true
            audio.position = [ FL, FR ]
            media.class = Audio/Sink
          }
          playback.props = {
            # Lets the real sink suspend when nothing plays.
            node.passive = true
            # A role with no loopback, so they don't link into one another.
            media.role = "Loopback"
            # Their ducked level isn't saved as a stream level.
            state.restore-props = false
          }
        }
        requires = [ support.client-context ]
      }
    }
  }
]

wireplumber.components = [
  {
    type = virtual, provides = policy.linking.role-based.loopbacks
    requires = [ loopback.sink.role.multimedia
                 loopback.sink.role.notification ]
  }
  {
    name = libpipewire-module-loopback, type = pw-module-client
    arguments = {
      node.name = "loopback.sink.role.multimedia"
      node.description = "Multimedia"
      capture.props = {
        device.intended-roles = [ "Music", "Movie", "Game", "Multimedia" ]
        policy.role-based.priority = 10
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "mix"
      }
    }
    provides = loopback.sink.role.multimedia
  }
  {
    name = libpipewire-module-loopback, type = pw-module-client
    arguments = {
      node.name = "loopback.sink.role.notification"
      node.description = "Notifications"
      capture.props = {
        device.intended-roles = [ "Notification" ]
        policy.role-based.priority = 20
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "duck"
      }
    }
    provides = loopback.sink.role.notification
  }
]
